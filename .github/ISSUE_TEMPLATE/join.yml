name: 申请加入互联聊天室
description: 提交站点资料，由维护者审核和联调。
title: "[申请加入] "
body:
  - type: markdown
    attributes:
      value: 表单内容会公开。请填写公开资料，访问令牌和密码应保存在服务端。
  - type: input
    id: siteName
    attributes:
      label: "站点名称"
      description: "站点正式名称"
    validations:
      required: true
  - type: textarea
    id: siteDescription
    attributes:
      label: "站点介绍"
      description: "用一两句话介绍站点或聊天室。"
    validations:
      required: true
  - type: input
    id: siteUrl
    attributes:
      label: "站点主页"
      description: "填写完整网址。"
    validations:
      required: true
  - type: input
    id: chatUrl
    attributes:
      label: "公开聊天室"
      description: "填写完整网址。"
    validations:
      required: true
  - type: input
    id: siteIconUrl
    attributes:
      label: "站点图标"
      description: "填写可公开访问的图标图片直链。"
    validations:
      required: true
  - type: input
    id: homeserver
    attributes:
      label: "Matrix homeserver"
      description: "填写服务器名，可带端口，省略协议和路径。"
    validations:
      required: true
  - type: input
    id: color
    attributes:
      label: "站点颜色"
      description: "填写可直接用于 CSS color 和 background-color 的颜色值，例如 #b86b91。"
    validations:
      required: true
  - type: input
    id: matrixUserId
    attributes:
      label: "站长 Matrix ID"
      description: "填写站长本人的完整 Matrix 用户 ID，格式为 @用户名:服务器名。"
    validations:
      required: true
  - type: input
    id: githubUsername
    attributes:
      label: 站长 GitHub 用户名
      description: 填写站长本人的 GitHub 用户名，省略 @ 和网址。
    validations:
      required: true
  - type: dropdown
    id: matrixAccountType
    attributes:
      label: "Matrix 接入方式"
      description: "user 表示各自使用独立账号，relay 表示共享转发账号。"
      options:
        - user
        - relay
    validations:
      required: true
  - type: input
    id: matrixRelayUserId
    attributes:
      label: "转发账号 Matrix ID"
      description: "选择 relay 时必填，填写实际代发消息账号的完整 ID。选择 user 时留空。"
    validations:
      required: false
