name: 为已审核的成员申请创建 PR

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: member-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  propose:
    if: github.event.label.name == '审核通过' && (startsWith(github.event.issue.title, '[申请加入]') || startsWith(github.event.issue.title, '[资料更新]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 校验申请并创建 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/approve-join.mjs
